# 求職偏好範本：複製成 preferences.yaml 後填入自己的資料（preferences.yaml 不進版控）
# 所有欄位都是必填

# 想做的工作內容、想累積的能力
目標方向:
  - 以 Python 開發後端服務與資料管線
  - 參與 LLM 應用的設計與落地

# 偏好／不偏好的產業（不偏好只會降低分數，不會淘汰），可以是空清單 []
產業偏好:
  喜歡: [軟體及網路相關業, 金融科技]
  不喜歡: [博弈]

# 單位：元。底線月薪必須 ≤ 期望月薪；年薪換算月薪時除以「年薪換算月數」
薪資:
  期望月薪: 70000
  底線月薪: 55000
  年薪換算月數: 14

# 符合任一條件就直接淘汰，不呼叫 AI
淘汰條件:
  公司: []                    # 完全比對公司名稱
  職稱關鍵字: [業務, 客服]      # 職缺名稱含其中任一字串（不分大小寫）

# 鍵必須剛好是這四個維度，值 ≥ 0 且總和 > 0（不要求總和為 1）
權重:
  職涯方向契合度: 0.4
  技能匹配度: 0.25
  產業公司吸引力: 0.15
  薪資水準: 0.2
