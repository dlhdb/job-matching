[project]
name = "job-matching-agent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "google-genai>=2.3.0",
    "pydantic>=2.13.5",
    "python-dotenv>=1.2.3",
    "pyyaml>=6.0.3",
    "requests>=2.34.2",
]

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "mypy>=2.2.0",
    "nbstripout>=0.9.1",
    "pandas>=3.0.5",
    "pytest>=9.1.1",
    "types-pyyaml>=6.0.12.20260906",
    "types-requests>=2.33.0.20260712",
]

[tool.pytest]
testpaths = ["tests"]
# 讓測試可以直接 import src/ 底下的模組
pythonpath = ["src"]
# importlib 模式允許 tests/ 與 tests/e2e/ 底下有同名的測試檔
addopts = ["--import-mode=importlib", "-m", "not network"]
strict_markers = true
markers = ["network: 需要連線到外部服務，預設跳過；用 -m network 執行"]
